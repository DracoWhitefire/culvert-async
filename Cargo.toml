[package]
name = "culvert-async"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Async typed access to the HDMI 2.1 SCDC register map"
readme = "README.md"
license = "MPL-2.0"
repository = "https://github.com/DracoWhitefire/culvert-async"
homepage = "https://ashlar-display.org"
keywords = ["ashlar", "hdmi", "no-std", "scdc", "async"]
categories = ["hardware-support", "embedded", "no-std", "no-std::no-alloc", "asynchronous"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[features]
plumbob-async = ["dep:plumbob-async", "culvert/plumbob"]

[dependencies]
culvert = { version = "0.2.0", default-features = false }
hdmi-hal-async = { version = "0.2.1", default-features = false }
plumbob-async = { version = "0.2.0", optional = true, default-features = false }

[[example]]
name = "scdc"
path = "examples/scdc/main.rs"

[dev-dependencies]
display-types = { version = "0.4", default-features = false }
pollster = { version = "0.3", features = ["macro"] }

# Temporary, until culvert (checked CED block reads), plumbob-async and plumbob (without
# `read_ced`), hdmi-hal-async and hdmi-hal (required `read_block`) and display-types 0.4.3
# (`HdmiForumFrl::lanes`) are published: replaces them for the whole graph, each other's
# dependencies included. Remove before merging.
[patch.crates-io]
culvert = { path = "../culvert" }
plumbob-async = { path = "../plumbob-async" }
plumbob = { path = "../plumbob" }
hdmi-hal-async = { path = "../hdmi-hal-async" }
hdmi-hal = { path = "../hdmi-hal" }
display-types = { path = "../display-types" }
